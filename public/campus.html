    <style>
      .campus-page { min-height: 100vh; display: grid; place-items: center; padding: 32px clamp(16px, 5vw, 88px); }
      .campus-shell { width: min(100%, 1744px); }
      .campus-back { display: inline-flex; align-items: center; min-height: 44px; color: #dbeafe; text-decoration: none; font-weight: 700; }
      .campus-back:hover, .campus-back:focus-visible { color: #fff; text-decoration: underline; }
      .campus-heading { margin: 28px 0 24px; }
      .campus-heading h1 { margin: 8px 0; }
      .campus-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(14px, 2vw, 28px); }
      .campus-action { display: flex; align-items: center; isolation: isolate; position: relative; overflow: hidden; min-width: 0; min-height: clamp(92px, 8.5vw, 154px); padding: 18px clamp(24px, 4vw, 76px); border: 1px solid rgba(255,255,255,.55); border-radius: 999px; background: linear-gradient(135deg, rgba(255,251,242,.9), rgba(248,241,225,.78) 55%, rgba(243,233,214,.85)); color: #202124; text-decoration: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.78), 0 18px 44px -18px rgba(10,12,28,.45); transition: color .5s, box-shadow .5s; }
      .campus-action:hover, .campus-action:focus-visible { color: #fff; box-shadow: 0 30px 90px -10px #faab0073; outline: 3px solid #93c5fd; outline-offset: 3px; }
      .campus-action__fill { z-index: -1; display: grid; grid-template-rows: repeat(5, 1fr); position: absolute; inset: 0; pointer-events: none; }
      .campus-action__fill i { transform: translateX(-101%); transition: transform .6s cubic-bezier(.16,1,.3,1); }
      .campus-action__fill i:nth-child(1) { background: #6D28D9; }
      .campus-action__fill i:nth-child(2) { background: #E11D48; transition-delay: 40ms; }
      .campus-action__fill i:nth-child(3) { background: #2563EB; transition-delay: 80ms; }
      .campus-action__fill i:nth-child(4) { background: #10B981; transition-delay: 120ms; }
      .campus-action__fill i:nth-child(5) { background: #F59E0B; transition-delay: 160ms; }
      .campus-action:hover .campus-action__fill i, .campus-action:focus-visible .campus-action__fill i { transform: none; }
      .campus-action strong { position: relative; font-size: clamp(1.6rem, .9rem + 1.8vw, 2.75rem); line-height: 1.1; letter-spacing: -.04em; }
      @media (max-width: 700px) { .campus-actions { grid-template-columns: 1fr; } .campus-action { min-height: 76px; padding: 16px 26px; } .campus-action strong { font-size: clamp(1.5rem, 7vw, 2rem); } }
      @media (prefers-reduced-motion: reduce) { .campus-action, .campus-action__fill i { transition: none; } }
