    <style>
      html, body { margin: 0; background: #fff; overflow-x: clip; scrollbar-width: none; -ms-overflow-style: none; }
      html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
      /* Five icon colors + V2 warm dusk/amber background shades. */
      .festival-landing {
        --purple: #6d28d9;
        --red: #e11d48;
        --blue: #2563eb;
        --green: #10b981;
        --amber: #f59e0b;
        --ink: #151515;
        --ease-out: cubic-bezier(.16, 1, .3, 1);
        position: relative;
        isolation: isolate;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        padding-top: env(safe-area-inset-top, 0px);
        background:
          radial-gradient(ellipse at 50% 43%, #fff 0%, #fff 17%, #fffdf9f0 35%, #fff0 67%),
          radial-gradient(ellipse at 0% 0%, #FFD287 0%, #FFE2A8a8 24%, #fff0 56%),
          radial-gradient(ellipse at 100% 0%, #FFB870 0%, #FFF1D6b8 27%, #fff0 57%),
          radial-gradient(ellipse at 0% 100%, #C44E7840 0%, #F2BE7E6b 28%, #fff0 56%),
          radial-gradient(ellipse at 100% 100%, #35286A38 0%, #7C3F6F35 25%, #fff0 58%),
          linear-gradient(160deg, #FFF1D6 0%, #fff 48%, #FFF1D6 100%);
        color: var(--ink);
        font-family: "Google Sans Flex", "Google Sans", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
      }
      .festival-landing * { box-sizing: border-box; }
      .festival-landing .scene-decor { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; contain: layout style; }
      .festival-landing .motif { position: absolute; display: block; overflow: visible; pointer-events: none; }
      .festival-landing .motif-arches { width: clamp(140px, 19vw, 270px); left: 0; top: clamp(18px, 6vh, 64px); transform-origin: 0 0; transform: rotate(90deg) translateY(-100%); opacity: 1; }
      .festival-landing .motif-flower { width: clamp(155px, 23vw, 340px); right: -5%; top: -8%; opacity: 1; }
      .festival-landing .motif-crystal { width: clamp(115px, 15vw, 230px); right: -3%; bottom: 17%; opacity: .94; }

      /* Bottom animated horizon & shimmering water ripples matching the locked section base */
      .festival-landing .rhythm-band {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: clamp(68px, 12.5vh, 112px);
        overflow: hidden;
        background: linear-gradient(180deg, #f3cd8b 0%, #f8db9f 62%, #fbe6be 100%);
        border-top: 2px solid #202124;
        contain: strict;
      }
      .festival-landing .rhythm-svg { width: 100%; height: 100%; display: block; }
      .festival-landing .water-flow { will-change: transform; stroke: #202124; stroke-width: 2px; stroke-linecap: round; fill: none; }
      .festival-landing .water-flow--1 { opacity: .26; animation: water-glide 24s linear infinite; }
      .festival-landing .water-flow--2 { opacity: .20; animation: water-glide-rev 32s linear infinite; }
      .festival-landing .water-flow--3 { opacity: .16; animation: water-glide 40s linear infinite; }

      .festival-landing .festival-content {
        width: min(840px, 78vw);
        position: relative;
        text-align: center;
        padding: clamp(20px, 4vh, 42px) 0 clamp(88px, 15vh, 132px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(10px, 2vh, 18px);
      }
      .festival-landing .theme-lockup { display: flex; flex-direction: column; align-items: center; width: min(520px, 68%, 50vh); line-height: 0; margin-bottom: clamp(-16px, -1.8vw, -6px); }
      .festival-landing .ayatic-logo { display: block; width: 100%; height: auto; overflow: visible; }
      .festival-landing .emblem-curve { animation: ink-rhythm 6.4s ease-in-out infinite; }
      .festival-landing .emblem-tl { animation-delay: 0s; }
      .festival-landing .emblem-tr { animation-delay: .22s; }
      .festival-landing .emblem-br { animation-delay: .44s; }
      .festival-landing .emblem-bl { animation-delay: .66s; }
      .festival-landing .emblem-inner-wave { animation: inner-rhythm 6.4s ease-in-out infinite .85s; }
      .festival-landing .emblem-tail { stroke-dasharray: 1; stroke-dashoffset: 0; animation: tail-draw 6.4s ease-in-out infinite; }
      .festival-landing .emblem-diamond { transform-box: fill-box; transform-origin: center; animation: diamond-touch 6.4s ease-in-out infinite; }
      .festival-landing .festival-identity { width: 100%; }
      .festival-landing .festival-logo { width: 100%; height: auto; display: block; overflow: visible; color: #10142F; shape-rendering: geometricPrecision; }
      .festival-landing .festival-date { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 5px 12px; font-weight: 700; font-size: clamp(14px, 1.8vw, 22px); letter-spacing: -.025em; line-height: 1.35; margin: 4px 0 0; color: #10142F; }
      .festival-landing .date-divider { width: 4px; height: 4px; border-radius: 50%; background: var(--purple); }

      /* Modern equal-size pill buttons aligned with the live portal theme */
      .festival-landing .festival-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        width: min(100%, 404px);
      }
      .festival-landing .festival-button {
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 54px;
        min-height: 54px;
        border-radius: 999px;
        border: 2px solid #202124;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 22px;
        font: 600 15px/1 "Google Sans Flex", "Google Sans", system-ui, sans-serif;
        letter-spacing: -.01em;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
        will-change: transform;
        transition: transform .35s var(--ease-out), background-color .3s var(--ease-out), color .3s var(--ease-out), border-color .3s var(--ease-out), box-shadow .35s var(--ease-out);
      }
      .festival-landing .explore-button {
        background: #202124;
        color: #fff;
        box-shadow: 0 14px 28px -14px rgba(16, 20, 47, .52), inset 0 1px 0 rgba(255, 255, 255, .16);
      }
      .festival-landing .explore-button:hover {
        background: #10142F;
        border-color: #10142F;
        transform: translateY(-2px);
        box-shadow: 0 18px 34px -14px rgba(16, 20, 47, .62), inset 0 1px 0 rgba(255, 255, 255, .2);
      }
      .festival-landing .portal-button {
        background: rgba(255, 255, 255, .76);
        color: #202124;
        border-color: rgba(32, 33, 36, .85);
        box-shadow: 0 10px 24px -16px rgba(36, 31, 80, .28), inset 0 1px 0 rgba(255, 255, 255, .92);
      }
      .festival-landing .portal-button:hover {
        background: #202124;
        color: #fff;
        border-color: #202124;
        transform: translateY(-2px);
        box-shadow: 0 16px 30px -14px rgba(16, 20, 47, .48);
      }
      .festival-landing .btn__arrow {
        display: inline-block;
        transition: transform .4s var(--ease-out);
      }
      .festival-landing .explore-button:hover .btn__arrow {
        transform: translateX(4px);
      }
      .festival-landing .btn__bars {
        position: absolute;
        left: 22px;
        right: 22px;
        bottom: 7px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
        opacity: 0;
        transform: scaleX(.4);
        transition: opacity .35s var(--ease-out), transform .5s var(--ease-out);
        pointer-events: none;
      }
      .festival-landing .btn__bars i {
        height: 3px;
        border-radius: 2px;
        display: block;
      }
      .festival-landing .btn__bars i:nth-child(1) { background: var(--purple); }
      .festival-landing .btn__bars i:nth-child(2) { background: var(--red); }
      .festival-landing .btn__bars i:nth-child(3) { background: var(--blue); }
      .festival-landing .btn__bars i:nth-child(4) { background: var(--green); }
      .festival-landing .btn__bars i:nth-child(5) { background: var(--amber); }
      .festival-landing .festival-button:hover .btn__bars,
      .festival-landing .festival-button:focus-visible .btn__bars {
        opacity: 1;
        transform: scaleX(1);
      }
      .festival-landing .festival-button:active { transform: translateY(0); }
      .festival-landing .festival-button:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
      .festival-landing .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

      /* Lightweight GPU-only decorative motion */
      .festival-landing .flower-rotate,
      .festival-landing .crystal-turn { transform-box: view-box; transform-origin: center; will-change: transform; }
      .festival-landing .flower-rotate { animation: festival-turn 38s linear infinite; }
      .festival-landing .crystal-turn { animation: festival-turn 46s linear infinite reverse; }
      .festival-landing .arch-breathe { transform-box: view-box; transform-origin: 50% 100%; animation: festival-breathe 7s ease-in-out infinite; }
      .festival-landing .logo-pupil { animation: festival-eye 6s ease-in-out infinite; }
      .festival-landing .logo-star { transform-box: fill-box; transform-origin: center; animation: festival-star 5s ease-in-out infinite; }
      .festival-landing .bottom-star { animation-delay: 2.5s; }
      .festival-landing .logo-line { stroke-dasharray: 1; animation: festival-line 5s ease-in-out infinite; }
      .festival-landing .bottom-line { animation-delay: 2.5s; }
      @keyframes ink-rhythm { 0%, 32%, 70%, 100% { opacity: 1; } 46% { opacity: .64; } 58% { opacity: 1; } }
      @keyframes inner-rhythm { 0%, 33%, 72%, 100% { opacity: 1; } 48% { opacity: .68; } 60% { opacity: 1; } }
      @keyframes tail-draw { 0%, 33%, 82%, 100% { stroke-dashoffset: 0; } 55% { stroke-dashoffset: .23; } }
      @keyframes diamond-touch { 0%, 55%, 85%, 100% { transform: scale(1); } 72% { transform: scale(1.10); } }

      @keyframes festival-turn { to { transform: rotate(360deg); } }
      @keyframes festival-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(.96); } }
      @keyframes water-glide { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-720px, 0, 0); } }
      @keyframes water-glide-rev { from { transform: translate3d(-720px, 0, 0); } to { transform: translate3d(0, 0, 0); } }
      @keyframes festival-eye { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-4px, 0); } 40% { transform: translate(0, -3px); } 60% { transform: translate(4px, 0); } 80% { transform: translate(0, 3px); } }
      @keyframes festival-star { 0%, 100%, 40% { transform: scale(1); opacity: 1; } 65% { transform: scale(.82); opacity: 1; } 80% { transform: scale(1.04); opacity: 1; } }
      @keyframes festival-line { 0%, 100%, 40% { stroke-dashoffset: 0; } 65% { stroke-dashoffset: -1; } 66% { stroke-dashoffset: 1; } }

      .festival-landing[data-paused="true"] * { animation-play-state: paused !important; }
      .festival-landing[data-motion="off"] * { animation: none !important; transition: none !important; }
      @media (prefers-reduced-motion: reduce) {
        .festival-landing * { animation: none !important; transition: none !important; }
      }

      @media (max-width: 700px) {
        .festival-landing .festival-content { width: min(92vw, 520px); gap: 12px; padding: 16px 0 clamp(88px, 15vh, 118px); }
        .festival-landing .motif-arches { left: 0; top: clamp(14px, 4vh, 36px); width: 32vw; }
        .festival-landing .motif-flower { right: -14%; top: -2%; width: 41vw; }
        .festival-landing .motif-crystal { right: -13%; bottom: 16%; width: 29vw; opacity: .72; }
        .festival-landing .festival-actions { gap: 10px; width: min(100%, 344px); }
        .festival-landing .festival-button { height: 48px; min-height: 48px; padding: 0 14px; font-size: 14px; gap: 7px; }
        .festival-landing .btn__bars { left: 16px; right: 16px; bottom: 5px; }
        .festival-landing .theme-lockup { width: min(78%, 280px); }
        .festival-landing .festival-date { font-size: clamp(12.5px, 3.4vw, 17px); gap: 4px 8px; }
        .festival-landing .rhythm-band { height: clamp(64px, 11vh, 90px); }
      }
      @media (max-height: 480px) {
        .festival-landing .festival-content { gap: 10px; padding: 10px 0 64px; width: min(64vw, 560px); }
        .festival-landing .theme-lockup { width: min(46%, 220px); }
        .festival-landing .festival-button { height: 40px; min-height: 40px; }
        .festival-landing .rhythm-band { height: 50px; }
        .festival-landing .motif-crystal { display: none; }
      }
      @media (max-width: 350px) {
        .festival-landing .festival-actions { width: 100%; gap: 8px; }
        .festival-landing .festival-button { padding: 0 10px; font-size: 13px; }
        .festival-landing .festival-content { width: 91vw; }
      }
    </style>
  </head>

            <span class="btn__bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          </a>
        </div>
      </section>
    </main>
    <div class="portal-coming-soon-backdrop" id="landing-coming-soon" role="dialog" aria-modal="true" aria-labelledby="landing-coming-soon-title" hidden>
      <div class="portal-coming-soon-dialog">
        <div class="portal-coming-soon-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="portal-coming-soon-badge">Student Portal</div>
        <h2 class="portal-coming-soon-title" id="landing-coming-soon-title">Available Soon</h2>
        <p class="portal-coming-soon-desc">Student Portal will be available very soon! You will be able to check candidate profiles, chest numbers, and live results right here.</p>
        <button type="button" class="portal-coming-soon-btn" id="landing-coming-soon-close">Got it</button>
      </div>
    </div>
    <style>
      .portal-coming-soon-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100020;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(16, 20, 47, 0.52);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        opacity: 0;
        visibility: hidden;
        transition: opacity .22s ease, visibility .22s ease;
      }
      .portal-coming-soon-backdrop[hidden] { display: none; }
      .portal-coming-soon-backdrop.is-open { opacity: 1; visibility: visible; }
      .portal-coming-soon-dialog {
        position: relative;
        width: min(100%, 380px);
        padding: 28px 24px 24px;
        border-radius: 24px;
        background: #ffffff;
        color: #151515;
        border: 1.5px solid rgba(32, 33, 36, .14);
        box-shadow: 0 24px 60px -16px rgba(16, 20, 47, .38);
        text-align: center;
        font-family: "Google Sans Flex", "Google Sans", system-ui, -apple-system, sans-serif;
        transform: translateY(10px) scale(.97);
        transition: transform .24s cubic-bezier(.16, 1, .3, 1);
        overflow: hidden;
      }
      .portal-coming-soon-backdrop.is-open .portal-coming-soon-dialog { transform: translateY(0) scale(1); }
      .portal-coming-soon-bars {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 5px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
      }
      .portal-coming-soon-bars i:nth-child(1) { background: #6d28d9; }
      .portal-coming-soon-bars i:nth-child(2) { background: #e11d48; }
      .portal-coming-soon-bars i:nth-child(3) { background: #2563eb; }
      .portal-coming-soon-bars i:nth-child(4) { background: #10b981; }
      .portal-coming-soon-bars i:nth-child(5) { background: #f59e0b; }
      .portal-coming-soon-badge {
        display: inline-flex;
        align-items: center;
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(37, 99, 235, .1);
        color: #2563eb;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      .portal-coming-soon-title {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -.025em;
        color: #10142F;
      }
      .portal-coming-soon-desc {
        margin: 0 0 20px;
        font-size: 14.5px;
        line-height: 1.5;
        color: #5f6368;
      }
      .portal-coming-soon-btn {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: #202124;
        color: #fff;
        font: 600 14px/1 "Google Sans Flex", "Google Sans", system-ui, sans-serif;
        padding: 13px 28px;
        cursor: pointer;
        transition: background-color .2s ease, transform .2s ease;
      }
      .portal-coming-soon-btn:hover { background: #10142F; transform: translateY(-1px); }
    </style>
    <script>
      (function () {
        var DEFAULT_TENANT = '45a0c1a0-bda0-4806-8477-f3fd3d6dfbbe';
        var LEGACY_TENANT = 'f87172d1-ed27-4db4-842c-cc00d3d56de2';
        var scene = document.querySelector('.festival-landing');
        var explore = document.getElementById('landing-explore');
        var portal = document.getElementById('landing-portal');
        var modal = document.getElementById('landing-coming-soon');
        var modalClose = document.getElementById('landing-coming-soon-close');

        var params = new URLSearchParams(location.search);
        var rawTenant = params.get('tenant_id');
        if (rawTenant === DEFAULT_TENANT || rawTenant === LEGACY_TENANT) {
          params.delete('tenant_id');
          var cleaned = params.toString();
          history.replaceState(history.state, '', location.pathname + (cleaned ? '?' + cleaned : '') + location.hash);
        }

        var forwardQuery = params.toString();
        if (explore) explore.href = '/explore' + (forwardQuery ? '?' + forwardQuery : '');

        function openModal() {
          if (!modal) return;
          modal.hidden = false;
          requestAnimationFrame(function () {
            modal.classList.add('is-open');
            if (modalClose) modalClose.focus({ preventScroll: true });
          });
        }
        function closeModal() {
          if (!modal) return;
          modal.classList.remove('is-open');
          setTimeout(function () {
            if (!modal.classList.contains('is-open')) modal.hidden = true;
            if (portal) portal.focus({ preventScroll: true });
          }, 220);
        }

        if (portal) portal.href = '/candidate-search' + (forwardQuery ? '?' + forwardQuery : '');
        if (modal) {
          modal.addEventListener('click', function (e) {
            if (e.target === modal || e.target === modalClose) closeModal();
          });
        }
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && modal && modal.classList.contains('is-open')) {
            e.preventDefault();
            closeModal();
            return;
          }
          if (e.key !== 'Enter' || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
          if (modal && modal.classList.contains('is-open')) return;
          if (e.target && /^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/i.test(e.target.tagName)) return;
          e.preventDefault();
          location.assign(explore ? explore.href : '/explore');
        });
        var visible = true;
        var sync = function () { if (scene) scene.dataset.paused = String(document.hidden || !visible); };
        if ('IntersectionObserver' in window && scene) {
          new IntersectionObserver(function (entries) {
            visible = Boolean(entries[0] && entries[0].isIntersecting);
            sync();
          }).observe(scene);
        }
        document.addEventListener('visibilitychange', sync);
        sync();
      })();
    </script>
  </body>
</html>
