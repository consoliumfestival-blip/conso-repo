    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        if (params.get('launch') !== '1') return;
        params.delete('launch');
        var q = params.toString();
        history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);

        var cancelled = false;
        var rafId = 0;
        var timers = [];
        var stop = function () {
          cancelled = true;
          if (rafId) cancelAnimationFrame(rafId);
          timers.forEach(clearTimeout);
          window.removeEventListener('wheel', stop);
          window.removeEventListener('touchstart', stop);
          window.removeEventListener('pointerdown', stop);
          window.removeEventListener('keydown', stop);
        };
        window.addEventListener('wheel', stop, { passive: true });
        window.addEventListener('touchstart', stop, { passive: true });
        window.addEventListener('pointerdown', stop, { passive: true });
        window.addEventListener('keydown', stop);

        function animateScroll(from, to, duration, ease, done) {
          var start = performance.now();
          function step(now) {
            if (cancelled) return;
            var t = Math.min(1, (now - start) / duration);
            var k = ease(t);
            window.scrollTo(0, from + (to - from) * k);
            if (t < 1) rafId = requestAnimationFrame(step);
            else if (done) done();
          }
          rafId = requestAnimationFrame(step);
        }

        function easeInOut(t) {
          return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        }

        function collectTourPlan(maxScroll) {
          var chapters = Array.from(document.querySelectorAll('.journey .chapter'));
          var stages = [];
          chapters.forEach(function (el) {
            var r = el.getBoundingClientRect();
            if (r.height < 40) return;
            var y = Math.round(window.scrollY + r.top);
            if (y < 100) y = 100;
            if (y > maxScroll) y = maxScroll;
            if (!stages.length || Math.abs(y - stages[stages.length - 1]) >= 160) {
              stages.push(y);
            }
          });
          if (!stages.length) {
            var journey = document.querySelector('.journey');
            var jy = journey ? Math.round(window.scrollY + journey.getBoundingClientRect().top) : Math.round(maxScroll * 0.2);
            stages = [
              Math.max(100, Math.min(maxScroll, jy)),
              Math.min(maxScroll, Math.round(maxScroll * 0.36)),
              Math.min(maxScroll, Math.round(maxScroll * 0.54))
            ];
          }

          var firstStageY = threeStages[0];
          var stops = threeStages.slice();
          if (Math.abs(maxScroll - stops[stops.length - 1]) >= 80) {
            stops.push(maxScroll);
          }
          return { stops: stops, firstStageY: firstStageY };
        }

          var pauseMs = 2000;
          timers.push(setTimeout(function () {

              var from = window.scrollY;
              var dist = Math.abs(target - from);
              var segMs = Math.max(4400, Math.min(13000, Math.round(dist * 5.6)));

                if (cancelled) return;
                timers.push(setTimeout(nextStop, pauseMs));
              });
            }

            nextStop();
          }, 2000));
