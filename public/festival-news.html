<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>if (location.pathname === "/festival-news.html") history.replaceState(null, "", "/news" + location.search + location.hash);</script>
    <title>News · Consoulium 2k26</title>
    <meta name="theme-color" content="#050816" />
    <link rel="icon" href="/brand/favicon.ico" />
    <script src="/festival-curtain.js?v=20261128b"></script>
    <link rel="stylesheet" href="/festival-pages.css?v=20261127f" />
  </head>
  <body data-page="news">
    <div class="sub-page">
      <main class="sub-main">
        <div class="sub-hero">
          <div>
            <span class="sub-eyebrow">Bulletins & Announcements</span>
            <h1>News</h1>
            <p class="sub-lede">Official announcements, stage advisories, and festival stories from Consoulium 2k26.</p>
          </div>
          <span class="meta-pill" id="updated"></span>
        </div>
        <div id="featured"></div>
        <div class="glass-tools">
          <input id="search" type="search" placeholder="Search bulletins or updates" aria-label="Search news" />
          <button class="glass-btn" id="refresh" type="button">Refresh</button>
        </div>
        <div class="filter-chips" id="filters" aria-label="Filter news by category"></div>
        <div id="content" class="glass-grid" aria-live="polite">
          <div class="empty">Loading bulletins…</div>
        </div>
      </main>
    </div>
    <script src="/festival-subpage-shell.js?v=20261128b" defer></script>
    <script src="/festival-cursor.js?v=20261127d" defer></script>
    <script src="/festival-pages.js?v=20261127g" defer></script>

</html>
