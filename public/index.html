<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Consolium" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/brand/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/brand/apple-touch-icon-152.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      (function () {
        var isTeamRoute = function () {
          return location.pathname === '/team' || location.pathname.indexOf('/team/') === 0;
        };
        var isTeamManagementRoute = function () {
          return location.pathname === '/team-leaders';
        };
        var isStageRoute = function () {
          return location.pathname.indexOf('/stage-management/venue/') === 0;
        };
        var isStandalonePwa = function () {
          return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
            || navigator.standalone === true;
        };
        var standaloneMode = isStandalonePwa();
        var requestedPortalMode = new URLSearchParams(location.search).get('installedPortal');
        var validPortalModes = ['main', 'team-management', 'team-leader'];
        if (standaloneMode) {
          try {
            if (validPortalModes.indexOf(requestedPortalMode) >= 0) {
              sessionStorage.setItem('ssf_installed_portal_mode', requestedPortalMode);
            }
            window.__installedPortalMode = validPortalModes.indexOf(requestedPortalMode) >= 0
              ? requestedPortalMode
              : sessionStorage.getItem('ssf_installed_portal_mode');
          } catch (_) {
            window.__installedPortalMode = validPortalModes.indexOf(requestedPortalMode) >= 0
              ? requestedPortalMode
              : null;
          }
        }
        var manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = isTeamRoute()
          ? '/team-manifest.json'
          : isTeamManagementRoute() ? '/team-management-manifest.json'
          : isStageRoute() ? '/portal-manifest?portal=stage&identity=' + encodeURIComponent(location.pathname.split('/')[3] || '') : '/manifest.json';
        document.head.appendChild(manifestLink);

        window.addEventListener('beforeinstallprompt', function (event) {
          if (isTeamRoute()) {
            event.preventDefault();
            window.__teamPortalInstallEvent = event;
            window.dispatchEvent(new Event('teamportalinstallavailable'));
            return;
          }
          if (isTeamManagementRoute()) {
            event.preventDefault();
            window.__teamManagementInstallEvent = event;
            window.dispatchEvent(new Event('teammanagementinstallavailable'));
            return;
          }
          if (location.pathname === '/judge' || location.pathname.indexOf('/judge/') === 0
            || location.pathname.indexOf('/announcer/') === 0) return;
          event.preventDefault();
          window.__mainPortalInstallEvent = event;
          window.dispatchEvent(new Event('mainportalinstallavailable'));
        });

        if (!isTeamRoute()) return;

        var viewport = document.querySelector('meta[name="viewport"]');
        if (viewport) {
          viewport.dataset.teamPortalPreviousContent = viewport.content;
          viewport.content = 'width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover';
          viewport.dataset.teamPortalBootstrap = 'true';
        }
        document.documentElement.dataset.teamPortalPreviousBackground = document.documentElement.style.backgroundColor;
        document.documentElement.style.backgroundColor = '#F4F5F6';
        document.documentElement.dataset.teamPortalBootstrap = 'true';

        var applyTeamThemeColor = function () {
          var themeColors = document.querySelectorAll('meta[name="theme-color"]');
          if (themeColors.length === 0) {
            var themeColor = document.createElement('meta');
            themeColor.name = 'theme-color';
            themeColor.dataset.teamPortalCreated = 'true';
            themeColors = [themeColor];
            document.head.appendChild(themeColor);
          }
          themeColors.forEach(function (themeColor) {
            if (!Object.prototype.hasOwnProperty.call(themeColor.dataset, 'teamPortalPreviousColor')) {
              themeColor.dataset.teamPortalPreviousColor = themeColor.content;
            }
            themeColor.content = '#1D1B19';
            themeColor.dataset.teamPortalBootstrap = 'true';
          });
        };
        applyTeamThemeColor();
        var headObserver = new MutationObserver(applyTeamThemeColor);
        headObserver.observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['name'] });
        document.addEventListener('DOMContentLoaded', function () {
          applyTeamThemeColor();
          headObserver.disconnect();
        }, { once: true });

      })();
    </script>
  </head>

  <body style="background-color: #050505;">
    <script>
      if (location.pathname === '/team' || location.pathname.indexOf('/team/') === 0) {
        document.body.dataset.teamPortalPreviousBackground = document.body.style.backgroundColor;
        document.body.style.backgroundColor = '#F4F5F6';
        document.body.dataset.teamPortalBootstrap = 'true';
      }
    </script>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
